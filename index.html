<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 鐳射卡牌生成器 - 從訪談到一鍵發布</title>
    <!-- 引入 html2canvas 用於一鍵高畫質匯出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #ff2a6d;
            --secondary-color: #05d9e8;
            --bg-color: #0b0c10;
            --panel-bg: rgba(20, 22, 30, 0.85);
            --text-color: #c5c6c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 30%, #1f2833 0%, #0b0c10 80%);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: #fff;
            font-size: 1.8rem;
            text-shadow: 0 0 10px var(--secondary-color);
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95rem;
            color: #8892b0;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            align-items: flex-start;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
        }

        /* 控制面板區 (階段一 & 階段三) */
        .control-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(5, 217, 232, 0.2);
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--secondary-color);
            margin-bottom: 12px;
            border-left: 4px solid var(--secondary-color);
            padding-left: 8px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #e2e8f0;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            background: #0b0c10;
            border: 1px solid #45567d;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 5px rgba(5, 217, 232, 0.5);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-color), #0077b6);
            color: #000;
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--secondary-color);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--primary-color), #b5179e);
            color: #fff;
        }

        .btn-success:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--primary-color);
        }

        /* 3D 卡牌展示區 (階段二：TCG 黃金比例 2.5:3.5) */
        .preview-container {
            display: flex;
            flex-direction: card;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            flex-direction: column;
            gap: 15px;
        }

        .card-scaler {
            width: 300px;
            height: 420px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card-front {
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        .card-back {
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--secondary-color);
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid var(--secondary-color);
            text-shadow: 0 0 10px var(--secondary-color);
        }

        /* 鐳射箔膜效果層 */
        .holo-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            mix-blend-mode: color-dodge;
            pointer-events: none;
            opacity: 0.75;
            transition: background 0.1s;
            border-radius: 16px;
            z-index: 5;
        }

        /* 卡牌內部排版 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .card-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card-hp {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #ffeb3b;
            font-weight: bold;
            border: 1px solid #ffeb3b;
        }

        .card-image-box {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 2;
        }

        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
        }

        .card-skill-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 3px;
        }

        .card-skill-desc {
            font-size: 0.75rem;
            color: #cbd5e1;
            line-height: 1.3;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            z-index: 2;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 5px;
        }

        .tip {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>3D 鐳射卡牌網頁生成器</h1>
        <p>從訪談需求、動態鑄造、到一鍵高清匯出 (HTML5 + CSS3 + JS)</p>
    </header>

    <div class="main-container">
        <!-- 控制面板 (階段一 & 階段三) -->
        <div class="control-panel">
            <div class="section-title">階段一：啟動卡牌鑄造訪談</div>
            
            <div class="form-group">
                <label>角色名稱 (Core Name)</label>
                <input type="text" id="inputName" value="AI 幻影使者" oninput="updateCard()">
            </div>

            <div class="form-group">
                <label>HP 能階與數值</label>
                <input type="text" id="inputHp" value="HP 9999" oninput="updateCard()">
            </div>

            <div class="form-group">
                <label>視覺與箔膜特效</label>
                <select id="foilSelect" onchange="updateCard()">
                    <option value="rainbow">宇宙彩虹 (Cosmic Rainbow)</option>
                    <option value="aurora">極光全息 (Aurora Holo)</option>
                    <option value="gold">黑金浮雕 (Dark Gold Foil)</option>
                </select>
            </div>

            <div class="form-group">
                <label>上傳角色圖片</label>
                <input type="file" id="imageUpload" accept="image/*" onchange="loadImage(event)">
            </div>

            <div class="form-group">
                <label>奧義技能名稱與描述</label>
                <input type="text" id="inputSkillName" value="【奧義】光速量子斬" oninput="updateCard()">
                <textarea id="inputSkillDesc" rows="2" oninput="updateCard()" style="margin-top:5px;">瞬間解析敵方防禦網，造成 999 點高畫質破甲傷害。</textarea>
            </div>

            <div class="form-group">
                <label>創作者署名與認證編號</label>
                <input type="text" id="inputCreator" value="Creator: 514170363 | No.001" oninput="updateCard()">
            </div>

            <div class="section-title" style="margin-top: 20px;">階段三：成果輸出與部署</div>
            <div class="btn-group">
                <button class="btn-primary" onclick="toggleFlip()">180度翻牌</button>
                <button class="btn-success" onclick="exportCard()">一鍵高畫質匯出 PNG</button>
            </div>
        </div>

        <!-- 3D 預覽展示區 (階段二) -->
        <div class="preview-container">
            <div class="card-scaler" id="cardScaler" onclick="toggleFlip()">
                <div class="card" id="cardElement">
                    <!-- 卡牌正面 -->
                    <div class="card-face card-front" id="cardFrontBg">
                        <div class="holo-overlay" id="holoOverlay"></div>
                        <div class="card-header">
                            <span class="card-name" id="displayName">AI 幻影使者</span>
                            <span class="card-hp" id="displayHp">HP 9999</span>
                        </div>
                        <div class="card-image-box">
                            <img id="displayImage" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500&auto=format&fit=crop" alt="Card Art">
                        </div>
                        <div class="card-body">
                            <div class="card-skill-title" id="displaySkillName">【奧義】光速量子斬</div>
                            <div class="card-skill-desc" id="displaySkillDesc">瞬間解析敵方防禦網，造成 999 點高畫質破甲傷害。</div>
                        </div>
                        <div class="card-footer">
                            <span id="displayCreator">Creator: 514170363 | No.001</span>
                            <span>TCG 3D LAB</span>
                        </div>
                    </div>
                    <!-- 卡牌背面 -->
                    <div class="card-face card-back">
                        <span>★ TCG LEGEND ★</span>
                    </div>
                </div>
            </div>
            <div class="tip">💡 提示：游標移至卡牌可體驗 3D 視差與鐳射光澤，點擊卡牌可進行 180 度翻轉！</div>
        </div>
    </div>

    <script>
        const cardElement = document.getElementById('cardElement');
        const cardScaler = document.getElementById('cardScaler');
        const holoOverlay = document.getElementById('holoOverlay');

        // 即時文字與設定更新
        function updateCard() {
            document.getElementById('displayName').innerText = document.getElementById('inputName').value;
            document.getElementById('displayHp').innerText = document.getElementById('inputHp').value;
            document.getElementById('displaySkillName').innerText = document.getElementById('inputSkillName').value;
            document.getElementById('displaySkillDesc').innerText = document.getElementById('inputSkillDesc').value;
            document.getElementById('displayCreator').innerText = document.getElementById('inputCreator').value;

            const foilType = document.getElementById('foilSelect').value;
            if (foilType === 'rainbow') {
                holoOverlay.style.background = `linear-gradient(135deg, rgba(255,0,0,0.4), rgba(0,255,0,0.4), rgba(0,0,255,0.4), rgba(255,0,255,0.4))`;
            } else if (foilType === 'aurora') {
                holoOverlay.style.background = `linear-gradient(135deg, rgba(5,217,232,0.5), rgba(255,42,109,0.5), rgba(255,235,59,0.5))`;
            } else {
                holoOverlay.style.background = `linear-gradient(135deg, rgba(212,175,55,0.6), rgba(50,50,50,0.8), rgba(212,175,55,0.4))`;
            }
        }

        // 圖片上傳預覽
        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                document.getElementById('displayImage').src = reader.result;
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        // 180度翻牌
        function toggleFlip() {
            cardElement.classList.toggle('flipped');
        }

        // 3D 視差與游標互動效果 (滑鼠傾斜與鐳射偏移)
        cardScaler.addEventListener('mousemove', (e) => {
            const rect = cardScaler.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            
            const rotateX = -((y - centerY) / centerY) * 15;
            const rotateY = ((x - centerX) / centerX) * 15;

            cardElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // 隨游標移動改變鐳射光澤位置
            const bgPosX = (x / rect.width) * 100;
            const bgPosY = (y / rect.height) * 100;
            holoOverlay.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;
        });

        cardScaler.addEventListener('mouseleave', () => {
            cardElement.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });

        // 一鍵高畫質匯出 PNG (整合 html2canvas)
        function exportCard() {
            // 確保匯出前為正面
            cardElement.classList.remove('flipped');
            setTimeout(() => {
                html2canvas(document.getElementById('cardFrontBg'), {
                    scale: 3, // 3倍高畫質匯出
                    useCORS: true,
                    backgroundColor: null
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${document.getElementById('inputName').value}_3D鐳射卡牌.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            }, 300);
        }

        // 初始化
        updateCard();
    </script>
</body>
</html>
